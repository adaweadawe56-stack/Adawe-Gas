function formatTimestamp(timestamp) {

    if (!timestamp) {
        return "—";
    }

    // Firestore Timestamp
    if (timestamp?.toDate) {
        return timestamp.toDate().toLocaleString("en-KE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });
    }

    // JavaScript Date
    if (timestamp instanceof Date) {
        return timestamp.toLocaleString("en-KE", {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        });
    }

    // ISO string
    if (typeof timestamp === "string") {

        const date = new Date(timestamp);

        if (!isNaN(date.getTime())) {

            return date.toLocaleString("en-KE", {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            });
        }
    }

    return "—";
}

window.login = async function(){

 try{

  const emailValue = document.getElementById("email").value;
  const passwordValue = document.getElementById("password").value;

  const userCredential = await signInWithEmailAndPassword(
    auth,
    emailValue,
    passwordValue
  );

  const uid = userCredential.user.uid;

  const adminDoc = await getDoc(doc(db,"admins",uid));

  if(!adminDoc.exists()){

    loginError.innerText = "Not admin";

    return;
  }

  loginPage.style.display = "none";

  dashboard.style.display = "block";

  startRealtime();

 }catch(err){

  console.error(err);

  loginError.innerText = err.message;
 }
};

function startRealtime(){

    onSnapshot(
        collection(db, "orders"),

        snap => {

            console.log("Orders Found:", snap.size);

            ordersData = [];

            snap.forEach(d => {

                const order = {
                    id: d.id,
                    ...d.data()
                };

                ordersData.push(order);

            });

            renderOrders();
            updateStatsAndChart();

        },

        error => {

            console.error(
                "Orders Error:",
                error.code,
                error.message
            );

        }
    );


    onSnapshot(
        collection(db, "sellers"),

        snap => {

            sellersData = [];

            snap.forEach(d => {

                sellersData.push({
                    id: d.id,
                    ...d.data()
                });

            });

            renderSellers();

        },

        error => {

            console.error(
                "Sellers Error:",
                error.code,
                error.message
            );

        }
    );

}

function updateStatsAndChart(){

    let total = 0;
    let pending = 0;
    let today = 0;
    let revenue = 0;

    const todayDate = new Date().toDateString();

    const dailyMap = {};

    ordersData.forEach(o => {

        // Total orders
        total++;


        // Pending orders
        if ((o.status || "Pending") === "Pending") {
            pending++;
        }


        // Revenue
        if (o.price) {
            revenue += Number(o.price);
        }


        // Created At
        if (o.createdAt) {

            const d =
                o.createdAt?.toDate
                    ? o.createdAt.toDate()
                    : new Date(o.createdAt);

            if (!isNaN(d.getTime())) {

                // Today's orders
                if (d.toDateString() === todayDate) {
                    today++;
                }


                // Orders per day
                const day =
                    d.toLocaleDateString("en-KE");

                dailyMap[day] =
                    (dailyMap[day] || 0) + 1;
            }
        }

    });


    // Dashboard statistics
    document.getElementById("totalOrders").innerText =
        total;

    document.getElementById("pendingOrders").innerText =
        pending;

    document.getElementById("todayOrders").innerText =
        today;

    document.getElementById("totalRevenue").innerText =
        revenue.toLocaleString();


    // Chart
    if (chart) {
        chart.destroy();
    }


    const salesCanvas =
        document.getElementById("salesChart");

    if (!salesCanvas) {
        return;
    }


    chart = new Chart(salesCanvas, {

        type: "line",

        data: {

            labels: Object.keys(dailyMap),

            datasets: [{

                label: "Orders per Day",

                data: Object.values(dailyMap)

            }]

        }

    });

}
    
function renderOrders() {

    const table =
        document.getElementById("ordersTable");

    const search =
        document.getElementById("searchOrders")
            .value
            .trim()
            .toLowerCase();

    const status =
        document.getElementById("statusFilter")
            .value;


    // =========================
    // FILTER ORDERS
    // =========================

    const filteredOrders =
        ordersData.filter(o => {

            const matchesSearch =
                !search ||

                (o.orderId || "")
                    .toLowerCase()
                    .includes(search) ||

                (o.name || "")
                    .toLowerCase()
                    .includes(search) ||

                (o.phone || "")
                    .toLowerCase()
                    .includes(search) ||

                (o.location || "")
                    .toLowerCase()
                    .includes(search) ||

                (o.sellerName || "")
                    .toLowerCase()
                    .includes(search);


            const matchesStatus =
                !status ||
                o.status === status;


            return (
                matchesSearch &&
                matchesStatus
            );

        });


    // =========================
    // TABLE HEADER
    // =========================

    table.innerHTML = `

        <thead>

            <tr>

                <th>Order ID</th>

                <th>Customer</th>

                <th>Phone</th>

                <th>Location</th>

                <th>Quantity</th>

                <th>Brand</th>

                <th>Seller</th>

                <th>Price</th>

                <th>Status</th>

                <th>Created At</th>

                <th>Assigned At</th>

                <th>Accepted At</th>

                <th>On The Way At</th>

                <th>Delivered At</th>

                <th>Rejected At</th>

                <th>Actions</th>

            </tr>

        </thead>

        <tbody></tbody>

    `;


    const tbody =
        table.querySelector("tbody");


    // =========================
    // RENDER FILTERED ORDERS
    // =========================

    filteredOrders.forEach(o => {

        const row =
            document.createElement("tr");


        row.innerHTML = `

            <td>
                ${o.orderId || "—"}
            </td>


            <td>
                ${o.name || "—"}
            </td>


            <td>
                ${o.phone || "—"}
            </td>


            <td>
                ${o.location || "—"}
            </td>


            <td>
                ${o.quantity || "—"}
            </td>


            <td>
                ${o.brand || "—"}
            </td>


            <td>
                ${o.sellerName || "—"}
            </td>


            <td>
                KES
                ${Number(o.price || 0)
                    .toLocaleString()}
            </td>


            <td>
                ${o.status || "—"}
            </td>


            <td>
                ${formatTimestamp(o.createdAt)}
            </td>


            <td>
                ${formatTimestamp(o.assignedAt)}
            </td>


            <td>
                ${formatTimestamp(o.acceptedAt)}
            </td>


            <td>
                ${formatTimestamp(o.onTheWayAt)}
            </td>


            <td>
                ${formatTimestamp(o.deliveredAt)}
            </td>


            <td>
                ${formatTimestamp(o.rejectedAt)}
            </td>


            <td>

                ${
                    o.customerLatitude != null &&
                    o.customerLongitude != null

                    ? `

                        <button

                            onclick="window.open(
                                'https://maps.google.com/?q=${o.customerLatitude},${o.customerLongitude}',
                                '_blank'
                            )"

                            class="btn btn-success btn-sm">

                            📍 Map

                        </button>

                    `

                    : ""
                }


                <button

                    onclick="editOrder('${o.id}')"

                    class="btn btn-primary btn-sm mt-1">

                    Edit

                </button>


                <button

                    onclick="deleteOrder('${o.id}')"

                    class="btn btn-danger btn-sm mt-1">

                    Delete

                </button>

            </td>

        `;


        tbody.appendChild(row);

    });

}

        document.getElementById("priceModalBody");

    body.innerHTML = "";

        "13kg",
        "15kg",
        "22kg",
        "25kg",
        "35kg",
        "40kg",
        "45kg",

    ];

    sizes.forEach(size => {

        body.innerHTML += `

window.saveSeller = async function(){

    const id =
        document.getElementById("editSellerId").value;

    const name =
        document.getElementById("editSellerName").value.trim();

    const phone =
        document.getElementById("editSellerPhone").value.trim();

    const location =
        document.getElementById("editSellerLocation").value.trim();

    const paymentStatus =
        document.getElementById("editPaymentStatus").value;

    const deliveryLimit =
        Number(
            document.getElementById("editDeliveryLimit").value
        );

    const commissionPerOrder =
        Number(
            document.getElementById("editCommissionPerOrder").value
        );


    // =========================
    // BASIC VALIDATION
    // =========================

    if(!name || !phone || !location){

        alert("Please fill all required fields");

        return;
    }


    if(!Number.isFinite(deliveryLimit) || deliveryLimit < 0){

        alert("Invalid delivery limit");

        return;
    }


    if(
        !Number.isFinite(commissionPerOrder) ||
        commissionPerOrder < 0
    ){

        alert("Invalid commission amount");

        return;
    }


    // =========================
    // PRICES
    // =========================

    const prices = {};

    let invalidPrice = false;

    document
        .querySelectorAll(".edit-price")
        .forEach(input => {

            const value = Number(input.value);

            if(!Number.isFinite(value) || value < 0){

                invalidPrice = true;

                alert(
                    `Invalid price for ${input.dataset.size}`
                );

                return;
            }

            prices[input.dataset.size] = value;

        });


    if(invalidPrice){

        return;
    }


    // =========================
    // BRANDS
    // =========================

    const brands = [];

    document
        .querySelectorAll(".edit-brand:checked")
        .forEach(cb => {

            brands.push(cb.value);

        });


    if(brands.length === 0){

        alert("Select at least one gas brand");

        return;
    }


    // =========================
    // UPDATE SELLER
    // =========================

    try{

        await updateDoc(
            doc(db,"sellers",id),
            {

                name,

                phone,

                location,

                prices,

                brands,

                paymentStatus,

                deliveryLimit,

                commissionPerOrder

            }
        );


        const modal =
            bootstrap.Modal.getInstance(
                document.getElementById(
                    "editSellerModal"
                )
            );


        if(modal){

            modal.hide();

        }


        alert(
            "Seller updated successfully"
        );


    }catch(error){

        console.error(
            "Save Seller Error:",
            error
        );

        alert(
            "Failed to update seller"
        );

    }

};

window.editOrder = async function(id) {

    const o = ordersData.find(x => x.id === id);

    if (!o) {
        alert("Order not found");
        return;
    }


    // =========================
    // CUSTOMER INFORMATION
    // =========================

    const name = prompt(
        "Customer Name:",
        o.name || ""
    );

    if (name === null) return;


    const phone = prompt(
        "Customer Phone:",
        o.phone || ""
    );

    if (phone === null) return;


    const location = prompt(
        "Customer Location:",
        o.location || ""
    );

    if (location === null) return;


    // =========================
    // ORDER INFORMATION
    // =========================

    const quantity = prompt(
        "Gas Quantity:",
        o.quantity || ""
    );

    if (quantity === null) return;


    const brand = prompt(
        "Gas Brand:",
        o.brand || ""
    );

    if (brand === null) return;


    // =========================
    // PRICE
    // =========================

    const priceInput = prompt(
        "Order Price (KES):",
        o.price || 0
    );

    if (priceInput === null) return;

    const price = Number(priceInput);

    if (isNaN(price) || price < 0) {

        alert("Invalid price");

        return;
    }


    // =========================
    // UPDATE FIRESTORE
    // =========================

    try {

        await updateDoc(
            doc(db, "orders", id),
            {

                name: name.trim(),

                phone: phone.trim(),

                location: location.trim(),

                quantity: quantity.trim(),

                brand: brand.trim(),

                price: price

            }
        );


        alert(
            "Order updated successfully"
        );

    } catch (error) {

        console.error(
            "Edit Order Error:",
            error
        );

        alert(
            "Failed to update order"
        );

    }

};
